<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Promises</title>
</head>
<body>
    <h1>2. Promises() method</h1>

    <script>
        /* 
            # promise() 
            => A promise is object that returns a values which you hope to recieve in the future, but not now.
            => Because the value will be returned by the promise in the future, the promise is very well-suited for hadling asynchronous operations.
            
            # Promise has three states:
            1. Pending: initial state, neither fulfilled nor rejected.
            2. Fulfilled: meaning that the operation was completed successfully.
            3. Rejected: meaning that the operation failed.
        */

        let status = false;
        const myPromise = new Promise((resolve, reject)=>{
            setTimeout(()=>{
                if(status){
                    resolve('I have complited Promise');
                }else{
                    reject('I am not complited Promise');
                }
            }, 5 * 2000);            
        });
        // O/P - Promise {<rejected>: 'I am not complited Promise'}

        /* 
            # Promises are used to handle asynchonous oprations.
            # The then(), catch() and finally() methods are used to consume a promise and handle
              its eventual outcome.
            
            # then():
            -> then() method is callad when a promise is successfully resolved (fullfiled).
            -> It takes up to two arguments: a callback function for success (onFulfilled) 
               and an "optional" callback function for failure (onRejected).
            -> The onFulfilled callback receives the resolved value of the promise as an argument.
        */

        // use arrow function for promise
        let active = true;
        const myPro = () => {
            return new Promise((res, rej) => { // res = resolve , rej = reject
                /* 
                    setTimeout() function schedules another function to be executed after a 4-second delay (2 * 2000 milliseconds).
                */
                setTimeout(() => { 
                    if(active){
                        res('This is promise solved successfully ');
                    }else{
                        rej('The promise is not complited ');
                    }
                }, 2 * 2000);
            });
        };
        myPro().then( 
                /* 
                    # then() method takes two (2) function as arguments.

                    -> The first function, (res) => {console.log('Success:', res)}, is the "fulfillment     
                       handler." It will run if the promise is resolved.
                    -> The second function, (rej) => {console.log('Failed:', rej)}, is the "rejection 
                       handler." It will run if the promise is rejected.
                */
                    (res)=>{console.log('Success:',res)}, 
                    (rej) => {console.log('Failed:', rej)}
                ); 
                
            // output = Success: This is promise solved successfully

        /* 
            # catch() method
            -> The catch() method is called when a promise is rejected (fails).
            -> It takes a single argument: a callback function that handles the error.
        */

        const isAdmin = true;
        const myPro2 = () =>{
            return new Promise((res, rej) => {
                setTimeout( () =>{
                    if(isAdmin)
                    {
                        res('User is admin');
                    }else{
                        rej('User is not admin ');
                    }
                }, 2 * 2000  );
            });                 
        };
        

        myPro2().then( (res) => {console.log("Success: ",res)} )
                .catch((error) => {console.log("Error: ",error)});
        // output : Success:  User is admin

        /* 
            # finally() method
            => finally() method is called when a promise is resolved or rejected
            => It takes a single argument: a callback function that executes when 
               the promise completes.
        */
        myPro2().then((res) => {console.log('success:' , res)})
                .catch((err) =>  console.log('Error: ',err))
                .finally(() => {console.log('It is done')});

        // output : Success:  User is admin , It is done

        // promise object with method chaining 
        const isNum = true ;
        const myPro3 = () => {
            return new Promise((res,rej ) => {
                setTimeout(() => {
                    if(isNum){
                        res('success: ');
                    }else{
                        rej('error: ');
                    }          
                },2 * 3000);
            });
        };

        // promise object with method chaining
        myPro3().then((suc) => {console.log(suc, "This is a number!!")})
                .catch((err) => {console.log(err, 'This is not a number..')})
                .finally(() => {console.log('Finished functions')});
    </script>
</body>
</html>
